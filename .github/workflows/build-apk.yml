name: Compilar APK Flutter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Configurar Keystore de Firma (si existe)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter_app/android/app/release.keystore
          fi

      - name: Instalar Dependencias
        run: |
          cd flutter_app
          flutter pub get

      - name: Ejecutar Pruebas Unitarias
        run: |
          cd flutter_app
          flutter test

      - name: Compilar APK Release
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd flutter_app
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Preparar Artefactos de Release y version.json
        run: |
          mkdir -p release_assets
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release_assets/ots-contador-release.apk
          VERSION_NAME=$(grep '^version:' flutter_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          cat <<EOF > release_assets/version.json
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${{ github.run_number }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/ots-contador-release.apk"
          }
          EOF

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OTS Contador v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            release_assets/ots-contador-release.apk
            release_assets/version.json

      - name: Publicar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: OTS-120-Dias-Android-App
          path: release_assets/ots-contador-release.apk
          if-no-files-found: error
